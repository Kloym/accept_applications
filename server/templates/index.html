<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Заявки</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #f5f5f5; }
        .btn {
            font-size: 2em;
            padding: 1em 2em;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover { background: #388E3C; }
    </style>
</head>
<body>
    <form action="/applications">
        <button class="btn" type="submit">Посмотреть заявки</button>
    </form>
</body>
</html>
