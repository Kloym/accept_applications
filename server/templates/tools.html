<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Инструменты сотрудника</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #6366f1;
            --secondary-color: #a855f7;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Карточка с эффектом стекла */
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            width: 100%;
            max-width: 700px;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-header {
            background: rgba(255, 255, 255, 0.5);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            padding: 1.5rem 1.5rem 0;
        }

        h2 {
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 0;
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 20px;
        }

        /* Табы */
        .nav-tabs {
            border-bottom: none;
            justify-content: center;
            gap: 10px;
        }

        .nav-link {
            border: none !important;
            border-radius: 50px !important;
            padding: 10px 20px;
            font-weight: 600;
            color: #6b7280;
            transition: all 0.3s ease;
            background: transparent;
        }

        .nav-link:hover {
            color: var(--primary-color);
            background: rgba(99, 102, 241, 0.1);
        }

        .nav-link.active {
            background: var(--primary-color) !important;
            color: white !important;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            transform: translateY(-2px);
        }
        
        /* Специфичные цвета для активных табов */
        #finish-tab.active { background: var(--success-color) !important; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
        #message-tab.active { background: var(--primary-color) !important; }
        #restore-tab.active { background: var(--warning-color) !important; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3); }

        .card-body {
            padding: 2rem;
        }

        /* Поля ввода */
        .form-floating > .form-control,
        .form-floating > .form-select {
            border-radius: 12px;
            border: 2px solid #e5e7eb;
            background: #f9fafb;
            transition: all 0.3s;
        }

        .form-floating > .form-control:focus,
        .form-floating > .form-select:focus {
            border-color: var(--primary-color);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        /* Кнопки */
        .btn-custom {
            border-radius: 12px;
            padding: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }

        .btn-finish { background: var(--success-color); border: none; color: white; }
        .btn-finish:hover { background: #059669; }

        .btn-message { background: var(--primary-color); border: none; color: white; }
        .btn-message:hover { background: #4f46e5; }

        .btn-restore { background: var(--warning-color); border: none; color: white; }
        .btn-restore:hover { background: #d97706; }

        /* Анимация контента */
        .tab-pane {
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Custom File Input */
        input[type="file"]::file-selector-button {
            border: none;
            background: #e5e7eb;
            padding: 8px 16px;
            border-radius: 8px;
            color: #374151;
            cursor: pointer;
            margin-right: 15px;
            transition: background .2s;
        }
        input[type="file"]::file-selector-button:hover {
            background: #d1d5db;
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }
        .custom-toast {
            background: white;
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
            animation: slideInRight 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 350px;
        }
        .custom-toast.success { border-left: 5px solid var(--success-color); }
        .custom-toast.error { border-left: 5px solid #ef4444; }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes fadeOutRight {
            to { transform: translateX(100%); opacity: 0; }
        }

        /* Spinner */
        .spinner-border-sm {
            width: 1.2rem;
            height: 1.2rem;
            border-width: 0.15em;
        }
    </style>
</head>
<body>

<div class="glass-card">
    <div class="card-header">
        <h2>🛠 Панель Сотрудника</h2>
        <ul class="nav nav-tabs" id="myTab" role="tablist">
            <li class="nav-item">
                <button class="nav-link active" id="finish-tab" data-bs-toggle="tab" data-bs-target="#finish" type="button">
                    <i class="fas fa-check-circle me-2"></i>Закрыть
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" id="message-tab" data-bs-toggle="tab" data-bs-target="#message" type="button">
                    <i class="fas fa-comment-dots me-2"></i>Сообщение
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" id="restore-tab" data-bs-toggle="tab" data-bs-target="#restore" type="button">
                    <i class="fas fa-undo-alt me-2"></i>Вернуть
                </button>
            </li>
        </ul>
    </div>

    <div class="card-body">
        <div class="tab-content" id="myTabContent">
            
            <div class="tab-pane fade show active" id="finish">
                <form onsubmit="submitForm(event, 'finish')">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="finish_app_id" name="app_id" placeholder="ID" required minlength="8" maxlength="8">
                        <label for="finish_app_id">ID Заявки</label>
                    </div>

                    <div class="form-floating mb-3">
                        <textarea class="form-control" id="finish_text" name="text" placeholder="Решение" style="height: 100px"></textarea>
                        <label for="finish_text">Решение / Ответ пользователю</label>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted small ms-1">Прикрепить фото (необязательно)</label>
                        <input type="file" class="form-control" name="photo">
                    </div>

                    <div class="form-floating mb-4">
                        <select class="form-select" id="finish_admin" name="admin_name" required>
                            <option value="" selected disabled>Выберите себя</option>
                            <option value="Пашков Евгений Олегович">Пашков Евгений Олегович</option>
                            <option value="Рискин Никита Дмитриевич">Рискин Никита Дмитриевич</option>
                            <option value="Долматов Артем Владимирович">Долматов Артем Владимирович</option>
                        </select>
                        <label for="finish_admin">Кто закрывает заявку?</label>
                    </div>

                    <button type="submit" class="btn btn-custom btn-finish w-100">
                        <span class="btn-text">Закрыть заявку</span>
                        <span class="spinner-border spinner-border-sm d-none" role="status"></span>
                    </button>
                </form>
            </div>

            <div class="tab-pane fade" id="message">
                <form onsubmit="submitForm(event, 'message')">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="msg_app_id" name="app_id" placeholder="ID" required minlength="8" maxlength="8">
                        <label for="msg_app_id">ID Заявки</label>
                    </div>

                    <div class="form-floating mb-3">
                        <textarea class="form-control" id="msg_text" name="text" placeholder="Текст" required style="height: 100px"></textarea>
                        <label for="msg_text">Сообщение пользователю</label>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-muted small ms-1">Прикрепить фото</label>
                        <input type="file" class="form-control" name="photo">
                    </div>

                    <div class="form-floating mb-4">
                        <select class="form-select" id="msg_admin" name="admin_name" required>
                            <option value="" selected disabled>Выберите себя</option>
                            <option value="Пашков Евгений Олегович">Пашков Евгений Олегович</option>
                            <option value="Рискин Никита Дмитриевич">Рискин Никита Дмитриевич</option>
                            <option value="Долматов Артем Владимирович">Долматов Артем Владимирович</option>
                        </select>
                        <label for="msg_admin">От кого сообщение?</label>
                    </div>

                    <button type="submit" class="btn btn-custom btn-message w-100">
                        <span class="btn-text">Отправить сообщение</span>
                        <span class="spinner-border spinner-border-sm d-none" role="status"></span>
                    </button>
                </form>
            </div>

            <div class="tab-pane fade" id="restore">
                <form onsubmit="submitForm(event, 'restore')">
                    <div class="alert alert-light border border-warning d-flex align-items-center mb-3 text-warning-emphasis">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        <small>Заявка будет возвращена в работу из архива.</small>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="rest_app_id" name="app_id" placeholder="ID" required minlength="8" maxlength="8">
                        <label for="rest_app_id">ID Заявки</label>
                    </div>

                    <div class="form-floating mb-4">
                        <select class="form-select" id="rest_admin" name="admin_name" required>
                            <option value="" selected disabled>Выберите себя</option>
                            <option value="Пашков Евгений Олегович">Пашков Евгений Олегович</option>
                            <option value="Рискин Никита Дмитриевич">Рискин Никита Дмитриевич</option>
                            <option value="Долматов Артем Владимирович">Долматов Артем Владимирович</option>
                        </select>
                        <label for="rest_admin">Кто восстанавливает?</label>
                    </div>

                    <button type="submit" class="btn btn-custom btn-restore w-100">
                        <span class="btn-text">Восстановить заявку</span>
                        <span class="spinner-border spinner-border-sm d-none" role="status"></span>
                    </button>
                </form>
            </div>

        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    async function submitForm(e, action) {
        e.preventDefault();
        const form = e.target;
        const btn = form.querySelector('button[type="submit"]');
        const btnText = btn.querySelector('.btn-text');
        const spinner = btn.querySelector('.spinner-border');

        btn.disabled = true;
        btnText.style.opacity = '0';
        spinner.classList.remove('d-none');

        const formData = new FormData(form);
        formData.append('action', action);

        try {
            const response = await fetch('/api/tools/execute', {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + 'sk_8f7d6a5s4d3f2g1h'
                },
                body: formData
            });
            
            const result = await response.json();
            
            if (response.ok) {
                showToast(result.message, 'success');
                form.reset();
            } else {
                showToast(`Ошибка: ${result.error}`, 'error');
            }
        } catch (err) {
            showToast(`Ошибка сети: ${err}`, 'error');
        } finally {
            btn.disabled = false;
            btnText.style.opacity = '1';
            spinner.classList.add('d-none');
        }
    }

    function showToast(message, type) {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        
        const icon = type === 'success' ? '<i class="fas fa-check-circle text-success fa-lg"></i>' : '<i class="fas fa-times-circle text-danger fa-lg"></i>';
        
        toast.className = `custom-toast ${type}`;
        toast.innerHTML = `
            ${icon}
            <div style="font-weight: 500; font-size: 0.95rem;">${message}</div>
        `;

        container.appendChild(toast);

        setTimeout(() => {
            toast.style.animation = 'fadeOutRight 0.5s forwards';
            setTimeout(() => toast.remove(), 500);
        }, 4000);
    }
</script>
</body>
</html>
